
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego by Buitrago</title>

<style>
:root {
  --artwork-zoom: 1.06;
  --artwork-shift-y: -2.5%;
  --transition-duration: 2s;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000;
}

.artwork-layer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  opacity: 0;
  transition: opacity var(--transition-duration) ease-in-out;
  pointer-events: none;
  background: #000;
}

.artwork-layer.active {
  opacity: 1;
}

.artwork-layer iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  transform: scale(var(--artwork-zoom));
  transform-origin: center center;
}

#error {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
  color: #fff;
  background: #000;
  font-family: monospace;
  font-size: 13px;
  text-align: center;
  z-index: 10;
}
</style>
</head>

<body>

<div id="layerA" class="artwork-layer active">
  <iframe title="Ego by Buitrago artwork A"
          allow="fullscreen"
          referrerpolicy="no-referrer"></iframe>
</div>

<div id="layerB" class="artwork-layer">
  <iframe title="Ego by Buitrago artwork B"
          allow="fullscreen"
          referrerpolicy="no-referrer"></iframe>
</div>

<div id="error"></div>

<script>
(function () {
  "use strict";

  // --------------------------------------------------
  // BITCOIN ORDINALS: 35 OBRAS ORIGINALES
  // --------------------------------------------------

  const TXID =
    "26f637df52c2289d33f74f01cfbf39c33769560a422234d499d907a4f313ba32";

  const ORDINALS_CONTENT =
    "https://ordinals.com/content/";

  // --------------------------------------------------
  // CONFIGURACIÓN TEMPORAL DE LOS SIETE NFT
  // --------------------------------------------------

  const INTERVAL_MINUTES = 12;

  const NFT_SEQUENCES = {
    1: [1, 0, 2, 8, 7],
    2: [3, 5, 6, 12, 9],
    3: [4, 13, 10, 14, 17],
    4: [11, 15, 18, 16, 22],
    5: [25, 19, 20, 21, 30],
    6: [29, 24, 23, 27, 31],
    7: [34, 26, 32, 28, 33]
  };

  // --------------------------------------------------
  // IDENTIFICACIÓN DEL NFT
  // --------------------------------------------------

  const params = new URLSearchParams(
    window.location.search
  );

  const nftParameter = params.get("nft");
  const nftNumber = Number(nftParameter);

  const sequence = NFT_SEQUENCES[nftNumber];

  const errorElement = document.getElementById("error");

  if (
    !nftParameter ||
    !Number.isInteger(nftNumber) ||
    !sequence
  ) {
    errorElement.textContent =
      "ERROR: NFT no válido. Utiliza ?nft=1 hasta ?nft=7.";

    errorElement.style.display = "flex";
    return;
  }

  // --------------------------------------------------
  // CAPAS DE VISUALIZACIÓN
  // --------------------------------------------------

  const layers = [
    document.getElementById("layerA"),
    document.getElementById("layerB")
  ];

  let activeLayer = 0;

  let currentArtwork = null;
  let pendingArtwork = null;

  let loadCounter = 0;
  let retryAfter = 0;

  // --------------------------------------------------
  // CARGA SEGURA DE UNA OBRA
  // --------------------------------------------------

  function showArtwork(artworkIndex) {

    if (
      !Number.isInteger(artworkIndex) ||
      artworkIndex < 0 ||
      artworkIndex > 34
    ) {
      return;
    }

    // Si ya está visible, cancelar una carga pendiente
    // que haya quedado obsoleta.
    if (artworkIndex === currentArtwork) {

      if (pendingArtwork !== null) {
        loadCounter++;
        pendingArtwork = null;
      }

      return;
    }

    // Evitar solicitar varias veces la misma obra.
    if (artworkIndex === pendingArtwork) {
      return;
    }

    // Esperar antes de reintentar una carga fallida.
    if (Date.now() < retryAfter) {
      return;
    }

    const nextLayer = activeLayer === 0 ? 1 : 0;
    const layer = layers[nextLayer];
    const frame = layer.querySelector("iframe");

    const requestNumber = ++loadCounter;

    const artworkURL =
      ORDINALS_CONTENT +
      TXID +
      "i" +
      artworkIndex;

    // Registrar la obra que está siendo solicitada.
    pendingArtwork = artworkIndex;

    // La capa de destino permanece oculta durante la carga.
    layer.classList.remove("active");

    frame.onload = function () {

      // Ignorar cargas anteriores que ya fueron reemplazadas.
      if (requestNumber !== loadCounter) {
        return;
      }

      // Confirmar que la obra terminó de cargar.
      currentArtwork = artworkIndex;
      pendingArtwork = null;
      retryAfter = 0;

      // Mostrar la nueva obra y ocultar la anterior.
      layer.classList.add("active");

      layers[activeLayer].classList.remove("active");

      activeLayer = nextLayer;
    };

    frame.onerror = function () {

      if (requestNumber !== loadCounter) {
        return;
      }

      console.error(
        "Error cargando la obra:",
        artworkURL
      );

      // Mantener visible la obra anterior.
      pendingArtwork = null;

      // Permitir un nuevo intento después de cinco segundos.
      retryAfter = Date.now() + 5000;
    };

    frame.src = artworkURL;
  }

  // --------------------------------------------------
  // RELOJ LOCAL
  // --------------------------------------------------

  function updateArtwork() {

    const now = new Date();

    const minutesOfDay =
      now.getHours() * 60 +
      now.getMinutes();

    const sequencePosition =
      Math.floor(
        minutesOfDay / INTERVAL_MINUTES
      ) % sequence.length;

    const artworkIndex =
      sequence[sequencePosition];

    showArtwork(artworkIndex);
  }

  // --------------------------------------------------
  // MODO DE PRUEBA
  // ?nft=1&art=0 muestra la primera posición.
  // --------------------------------------------------

  const testArtwork = params.get("art");

  if (testArtwork !== null) {

    const forcedPosition = Number(testArtwork);

    if (
      !Number.isInteger(forcedPosition) ||
      forcedPosition < 0 ||
      forcedPosition >= sequence.length
    ) {
      errorElement.textContent =
        "ERROR: art debe estar entre 0 y " +
        (sequence.length - 1) +
        " para este NFT.";

      errorElement.style.display = "flex";
      return;
    }

    const artworkIndex =
      sequence[forcedPosition];

    showArtwork(artworkIndex);

  } else {

    updateArtwork();

    // Comprobación cada segundo.
    // Las cargas pendientes no se reinician.
    setInterval(updateArtwork, 1000);
  }

})();
</script>

</body>
</html>
