
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego by Buitrago</title>

<style>
:root {
  --artwork-zoom: 1.06;
  --artwork-shift-y: -2.5%;
  --transition-duration: 2s;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000;
}

.artwork-layer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  opacity: 0;
  transition: opacity var(--transition-duration) ease-in-out;
  pointer-events: none;
  background: #000;
}

.artwork-layer.active {
  opacity: 1;
}

.artwork-layer iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* Recorte y escala de la obra */
.artwork-layer iframe {
  transform: scale(var(--artwork-zoom));
  transform-origin: center center;
}

#error {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
  color: #fff;
  background: #000;
  font-family: monospace;
  font-size: 13px;
  text-align: center;
  z-index: 10;
}
</style>
</head>

<body>

<div id="layerA" class="artwork-layer active">
  <iframe title="Ego by Buitrago artwork A"
          allow="fullscreen"
          referrerpolicy="no-referrer"></iframe>
</div>

<div id="layerB" class="artwork-layer">
  <iframe title="Ego by Buitrago artwork B"
          allow="fullscreen"
          referrerpolicy="no-referrer"></iframe>
</div>

<div id="error"></div>

<script>
(function () {
  "use strict";

  // --------------------------------------------------
  // BITCOIN ORDINALS: 35 OBRAS ORIGINALES
  // --------------------------------------------------

  const TXID =
    "26f637df52c2289d33f74f01cfbf39c33769560a422234d499d907a4f313ba32";

  const ORDINALS_CONTENT =
    "https://ordinals.com/content/";

  // --------------------------------------------------
  // CONFIGURACIÓN TEMPORAL DE LOS SIETE NFT
  // Los índices son de base cero: obra 1 = i0.
  // --------------------------------------------------

  const INTERVAL_MINUTES = 12;

  const NFT_SEQUENCES = {
    1: [1, 0, 2, 8, 7],
    2: [3, 5, 6, 12, 9],
    3: [4, 13, 10, 14, 17],
    4: [11, 15, 18, 16, 22],
    5: [25, 19, 20, 21, 30],
    6: [29, 25, 23, 27, 31],
    7: [34, 26, 32, 28, 33]
  };

  // --------------------------------------------------
  // IDENTIFICACIÓN DEL NFT
  // Cada JSON deberá apuntar al HTML con ?nft=N
  // --------------------------------------------------

  const params = new URLSearchParams(
    window.location.search
  );

  const nftParameter = params.get("nft");
  const nftNumber = Number(nftParameter);

  const sequence = NFT_SEQUENCES[nftNumber];

  const errorElement = document.getElementById("error");

  if (
    !nftParameter ||
    !Number.isInteger(nftNumber) ||
    !sequence
  ) {
    errorElement.textContent =
      "ERROR: NFT no válido. Utiliza ?nft=1 hasta ?nft=7.";

    errorElement.style.display = "flex";
    return;
  }

  // --------------------------------------------------
  // CAPAS DE VISUALIZACIÓN
  // Dos capas permiten hacer el crossfade.
  // --------------------------------------------------

  const layers = [
    document.getElementById("layerA"),
    document.getElementById("layerB")
  ];

  let activeLayer = 0;
  let currentArtwork = null;
  let loadCounter = 0;

  // --------------------------------------------------
  // CARGA DE UNA OBRA ORIGINAL
  // artworkIndex corresponde a i0 ... i34.
  // --------------------------------------------------

  function showArtwork(artworkIndex) {

    if (
      !Number.isInteger(artworkIndex) ||
      artworkIndex < 0 ||
      artworkIndex > 34
    ) {
      return;
    }

    if (artworkIndex === currentArtwork) {
      return;
    }

    currentArtwork = artworkIndex;

    const nextLayer = activeLayer === 0 ? 1 : 0;
    const layer = layers[nextLayer];
    const frame = layer.querySelector("iframe");

    const requestNumber = ++loadCounter;

    const artworkURL =
      ORDINALS_CONTENT +
      TXID +
      "i" +
      artworkIndex;

    layer.classList.remove("active");

    frame.onload = function () {

      // Evita que una carga anterior interrumpa
      // una solicitud más reciente.
      if (requestNumber !== loadCounter) {
        return;
      }

      layer.classList.add("active");

      layers[activeLayer].classList.remove("active");

      activeLayer = nextLayer;
    };

    frame.onerror = function () {
      console.error(
        "Error cargando la obra:",
        artworkURL
      );
    };

    frame.src = artworkURL;
  }

  // --------------------------------------------------
  // RELOJ LOCAL
  // Selecciona la obra según la hora del dispositivo.
  // --------------------------------------------------

  function updateArtwork() {

    const now = new Date();

    const minutesOfDay =
      now.getHours() * 60 +
      now.getMinutes();

    const sequencePosition =
      Math.floor(
        minutesOfDay / INTERVAL_MINUTES
      ) % sequence.length;

    const artworkIndex =
      sequence[sequencePosition];

    showArtwork(artworkIndex);
  }

  // --------------------------------------------------
  // MODO DE PRUEBA
  // ?nft=1&art=0 fuerza la obra i0.
  // art representa el índice Ordinals (0 a 34).
  // --------------------------------------------------

  const testArtwork = params.get("art");

  if (testArtwork !== null) {

    const forcedArtwork = Number(testArtwork);

    if (
      Number.isInteger(forcedArtwork) &&
      forcedArtwork >= 0 &&
      forcedArtwork <= 34
    ) {
      showArtwork(forcedArtwork);
    } else {
      errorElement.textContent =
        "ERROR: El parámetro art debe estar entre 0 y 34.";

      errorElement.style.display = "flex";
      return;
    }

  } else {

    updateArtwork();

    // Comprobación cada segundo.
    // Solo cambia la obra cuando corresponde.
    setInterval(updateArtwork, 1000);
  }

})();
</script>

</body>
</html>
