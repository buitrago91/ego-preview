
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego by Buitrago</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<script>
(function () {
    "use strict";

    // Bitcoin transaction containing the 35 artworks
    const TXID =
    "26f637df52c2289d33f74f01cfbf39c33769560a422234d499d907a4f313ba32";

    // Read artwork ID from the URL
    const params = new URLSearchParams(
        window.location.search
    );

    // Default artwork is #1 (i0)
    const id = Number(params.get("id") ?? 0);

    // Validate artwork ID
    if (!Number.isInteger(id) || id < 0 || id > 34) {
        document.body.innerHTML = "";
        return;
    }

    // Build Bitcoin Ordinal inscription ID
    const inscriptionID = TXID + "i" + id;

    // Create artwork viewer
    const frame = document.createElement("iframe");

    frame.src =
        "https://ordinals.com/content/" + inscriptionID;

    frame.title = "Ego by Buitrago";

    document.body.appendChild(frame);

})();
</script>

</body>
</html>
