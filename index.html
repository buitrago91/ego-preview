
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego by Buitrago - Temporal Viewer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<script>
(async function () {
    "use strict";

    const TXID =
    "26f637df52c2289d33f74f01cfbf39c33769560a422234d499d907a4f313ba32";

    const params = new URLSearchParams(
        window.location.search
    );

    // Identify the JSON assigned to this NFT
    const configPath = params.get("config");

    if (!configPath) {
        document.body.textContent =
            "ERROR: No NFT configuration specified.";
        return;
    }

    let configURL;

    try {
        configURL = new URL(configPath, window.location.href);

        // Only allow configuration files from this website
        if (configURL.origin !== window.location.origin) {
            throw new Error("Invalid configuration origin");
        }

    } catch (error) {
        document.body.textContent =
            "ERROR: Invalid configuration URL.";
        return;
    }

    try {
        // Load this NFT's JSON configuration
        const response = await fetch(configURL);

        if (!response.ok) {
            throw new Error("Could not load NFT JSON");
        }

        const metadata = await response.json();

        const temporal = metadata.temporal_sequence;

        if (
            !temporal ||
            !Array.isArray(temporal.artworks) ||
            temporal.artworks.length === 0
        ) {
            throw new Error("Invalid temporal sequence");
        }

        const artworks = temporal.artworks;
        const interval = Number(temporal.interval_minutes);

        if (
            !Number.isFinite(interval) ||
            interval <= 0 ||
            interval > 60
        ) {
            throw new Error("Invalid interval");
        }

        if (
            !artworks.every(id =>
                Number.isInteger(id) &&
                id >= 0 &&
                id <= 34
            )
        ) {
            throw new Error("Invalid Ordinals artwork index");
        }

        let currentArtwork = -1;

        const frame = document.createElement("iframe");
        frame.title = metadata.name || "Ego by Buitrago";

        document.body.appendChild(frame);

        function showArtwork(artworkID) {

            if (artworkID === currentArtwork) {
                return;
            }

            currentArtwork = artworkID;

            const inscriptionID = TXID + "i" + artworkID;

            frame.src =
                "https://ordinals.com/content/" +
                inscriptionID;
        }

        function updateArtwork() {

            // Optional manual test: ?art=2
            const manualArt = params.get("art");

            if (manualArt !== null) {
                const id = Number(manualArt);

                if (
                    Number.isInteger(id) &&
                    id >= 0 &&
                    id <= 34
                ) {
                    showArtwork(id);
                }

                return;
            }

            // Read the local device clock
            const minute = new Date().getMinutes();

            // Calculate the position in this NFT's sequence
            const position =
                Math.floor(minute / interval) % artworks.length;

            showArtwork(artworks[position]);
        }

        updateArtwork();

        // Check the clock every second
        setInterval(updateArtwork, 1000);

    } catch (error) {
        document.body.textContent =
            "Ego by Buitrago - " + error.message;

        console.error(error);
    }

})();
</script>

</body>
</html>
