
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego by Buitrago - Temporal Viewer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* Two overlapping artwork layers */

.artwork-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;

    opacity: 0;
    transition: opacity 2s ease-in-out;
}

/* The visible artwork */
.artwork-frame.active {
    opacity: 1;
}
</style>
</head>

<body>

<script>
(async function () {
    "use strict";

    const TXID =
    "26f637df52c2289d33f74f01cfbf39c33769560a422234d499d907a4f313ba32";

    const params = new URLSearchParams(
        window.location.search
    );

    // Identify this NFT's JSON configuration
    const configPath = params.get("config");

    if (!configPath) {
        document.body.textContent =
            "ERROR: No NFT configuration specified.";
        return;
    }

    let configURL;

    try {
        configURL = new URL(
            configPath,
            window.location.href
        );

        if (
            configURL.origin !== window.location.origin
        ) {
            throw new Error("Invalid configuration origin");
        }

    } catch (error) {
        document.body.textContent =
            "ERROR: Invalid configuration URL.";
        return;
    }

    try {
        // Load NFT configuration
        const response = await fetch(configURL);

        if (!response.ok) {
            throw new Error("Could not load NFT JSON");
        }

        const metadata = await response.json();

        const temporal = metadata.temporal_sequence;

        if (
            !temporal ||
            !Array.isArray(temporal.artworks) ||
            temporal.artworks.length === 0
        ) {
            throw new Error("Invalid temporal sequence");
        }

        const artworks = temporal.artworks;
        const interval = Number(
            temporal.interval_minutes
        );

        if (
            !Number.isFinite(interval) ||
            interval <= 0 ||
            interval > 60
        ) {
            throw new Error("Invalid interval");
        }

        if (
            !artworks.every(id =>
                Number.isInteger(id) &&
                id >= 0 &&
                id <= 34
            )
        ) {
            throw new Error("Invalid artwork index");
        }

        // Create two overlapping frames
        const frames = [
            document.createElement("iframe"),
            document.createElement("iframe")
        ];

        frames.forEach((frame, index) => {
            frame.className = "artwork-frame";
            frame.title =
                (metadata.name || "Ego by Buitrago") +
                " - Layer " + (index + 1);

            document.body.appendChild(frame);
        });

        let activeIndex = -1;
        let currentArtwork = -1;

        function showArtwork(artworkID) {

            if (artworkID === currentArtwork) {
                return;
            }

            currentArtwork = artworkID;

            // Select the inactive frame
            const nextIndex =
                activeIndex === 0 ? 1 : 0;

            const nextFrame = frames[nextIndex];

            // Prepare the new artwork behind the visible one
            nextFrame.classList.remove("active");

            nextFrame.onload = function () {

                // First artwork: show without transition
                if (activeIndex === -1) {
                    nextFrame.classList.add("active");
                    activeIndex = nextIndex;
                    return;
                }

                // Crossfade between artworks
                const previousFrame = frames[activeIndex];

                requestAnimationFrame(() => {

                    nextFrame.classList.add("active");
                    previousFrame.classList.remove("active");

                    activeIndex = nextIndex;
                });
            };

            // Load the selected Bitcoin Ordinal
            const inscriptionID =
                TXID + "i" + artworkID;

            nextFrame.src =
                "https://ordinals.com/content/" +
                inscriptionID;
        }

        function updateArtwork() {

            // Manual artwork selection for testing
            const manualArt = params.get("art");

            if (manualArt !== null) {

                const id = Number(manualArt);

                if (
                    Number.isInteger(id) &&
                    id >= 0 &&
                    id <= 34
                ) {
                    showArtwork(id);
                }

                return;
            }

            // Read local device clock
            const minute = new Date().getMinutes();

            // Calculate sequence position
            const position =
                Math.floor(minute / interval) %
                artworks.length;

            // Select artwork from this NFT's JSON
            showArtwork(artworks[position]);
        }

        // Show first artwork immediately
        updateArtwork();

        // Check local time every second
        setInterval(updateArtwork, 1000);

    } catch (error) {
        document.body.textContent =
            "Ego by Buitrago - " + error.message;

        console.error(error);
    }

})();
</script>

</body>
</html>
