
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego by Buitrago</title>

<style>
:root {
  --artwork-zoom: 1.06;
  --artwork-shift-y: -2.5%;
  --transition-duration: 2s;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000;
}

.artwork-layer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  opacity: 0;
  transition: opacity var(--transition-duration) ease-in-out;
  pointer-events: none;
  background: #000;
  will-change: opacity;
}

.artwork-layer.active {
  opacity: 1;
}

.artwork-layer iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  transform: scale(var(--artwork-zoom));
  transform-origin: center center;
}

#error {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
  color: #fff;
  background: #000;
  font-family: monospace;
  font-size: 13px;
  text-align: center;
  z-index: 10;
}
</style>
</head>

<body>

<div id="layerA" class="artwork-layer">
  <iframe
    title="Ego by Buitrago artwork A"
    allow="fullscreen"
    referrerpolicy="no-referrer">
  </iframe>
</div>

<div id="layerB" class="artwork-layer">
  <iframe
    title="Ego by Buitrago artwork B"
    allow="fullscreen"
    referrerpolicy="no-referrer">
  </iframe>
</div>

<div id="error"></div>

<script>
(function () {
  "use strict";

  // --------------------------------------------------
  // BITCOIN ORDINALS: 35 OBRAS ORIGINALES
  // --------------------------------------------------

  const TXID =
    "26f637df52c2289d33f74f01cfbf39c33769560a422234d499d907a4f313ba32";

  const ORDINALS_CONTENT =
    "https://ordinals.com/content/";

  // --------------------------------------------------
  // CONFIGURACIÓN TEMPORAL
  // --------------------------------------------------

  const INTERVAL_MINUTES = 2;

  // Tiempo máximo para completar una carga.
  const LOAD_TIMEOUT = 25000;

  // Tiempo adicional después de onload antes de mostrar.
  const STABILIZATION_TIME = 1500;

  // Espera antes de volver a intentar una carga fallida.
  const RETRY_DELAY = 5000;

  // --------------------------------------------------
  // SECUENCIAS DE LOS SIETE NFT
  // --------------------------------------------------

  const NFT_SEQUENCES = {
    1: [1, 0, 2, 8, 7],
    2: [3, 5, 6, 12, 9],
    3: [4, 13, 10, 14, 17],
    4: [11, 15, 18, 16, 22],
    5: [25, 19, 20, 21, 30],
    6: [29, 24, 23, 27, 31],
    7: [34, 26, 32, 28, 33]
  };

  // --------------------------------------------------
  // IDENTIFICACIÓN DEL NFT
  // --------------------------------------------------

  const params = new URLSearchParams(
    window.location.search
  );

  const nftParameter = params.get("nft");
  const nftNumber = Number(nftParameter);

  const sequence = NFT_SEQUENCES[nftNumber];

  const errorElement =
    document.getElementById("error");

  if (
    !nftParameter ||
    !Number.isInteger(nftNumber) ||
    !sequence
  ) {
    errorElement.textContent =
      "ERROR: NFT no válido. Utiliza ?nft=1 hasta ?nft=7.";

    errorElement.style.display = "flex";
    return;
  }

  // --------------------------------------------------
  // CAPAS DE VISUALIZACIÓN
  // --------------------------------------------------

  const layers = [
    document.getElementById("layerA"),
    document.getElementById("layerB")
  ];

  const frames = [
    layers[0].querySelector("iframe"),
    layers[1].querySelector("iframe")
  ];

  // -1 significa que todavía no hay una obra visible.
  let activeLayer = -1;

  let currentArtwork = null;
  let pendingArtwork = null;

  let loadCounter = 0;

  let loadWatchdog = null;
  let stabilizationTimer = null;

  let retryAfter = 0;

  // --------------------------------------------------
  // LIMPIEZA DE TEMPORIZADORES
  // --------------------------------------------------

  function clearLoadTimers() {

    if (loadWatchdog !== null) {
      clearTimeout(loadWatchdog);
      loadWatchdog = null;
    }

    if (stabilizationTimer !== null) {
      clearTimeout(stabilizationTimer);
      stabilizationTimer = null;
    }
  }

  // --------------------------------------------------
  // CANCELAR UNA CARGA OBSOLETA
  // --------------------------------------------------

  function cancelPendingLoad() {

    if (pendingArtwork === null) {
      return;
    }

    loadCounter++;

    clearLoadTimers();

    pendingArtwork = null;
  }

  // --------------------------------------------------
  // MOSTRAR UNA OBRA YA CARGADA
  // --------------------------------------------------

  function commitArtwork(
    artworkIndex,
    layerIndex,
    requestNumber
  ) {

    if (requestNumber !== loadCounter) {
      return;
    }

    if (pendingArtwork !== artworkIndex) {
      return;
    }

    const previousLayer = activeLayer;

    // Registrar la nueva obra antes de cambiar las capas.
    currentArtwork = artworkIndex;
    activeLayer = layerIndex;
    pendingArtwork = null;

    retryAfter = 0;

    clearLoadTimers();

    // Primero activar la nueva capa.
    // La anterior sigue visible durante el fundido.
    layers[layerIndex].classList.add("active");

    // Después iniciar el fundido de salida.
    if (previousLayer !== -1) {
      layers[previousLayer].classList.remove("active");
    }

    console.log(
      "Ego: obra activa",
      artworkIndex,
      "NFT:",
      nftNumber
    );
  }

  // --------------------------------------------------
  // FALLA O TIEMPO DE ESPERA AGOTADO
  // --------------------------------------------------

  function handleLoadFailure(
    artworkIndex,
    requestNumber,
    reason
  ) {

    if (requestNumber !== loadCounter) {
      return;
    }

    console.warn(
      "Ego: no se pudo completar la carga de la obra",
      artworkIndex,
      reason
    );

    clearLoadTimers();

    pendingArtwork = null;

    // La obra anterior permanece visible.
    // Se permitirá un nuevo intento.
    retryAfter = Date.now() + RETRY_DELAY;
  }

  // --------------------------------------------------
  // CARGA DE UNA NUEVA OBRA
  // --------------------------------------------------

  function showArtwork(artworkIndex) {

    if (
      !Number.isInteger(artworkIndex) ||
      artworkIndex < 0 ||
      artworkIndex > 34
    ) {
      return;
    }

    // Si ya está visible, no hacer nada.
    if (artworkIndex === currentArtwork) {

      if (pendingArtwork !== null) {
        cancelPendingLoad();
      }

      return;
    }

    // Si la misma obra ya está cargándose,
    // no iniciar otra solicitud.
    if (artworkIndex === pendingArtwork) {
      return;
    }

    // Si la obra solicitada cambió,
    // cancelar la carga anterior.
    if (pendingArtwork !== null) {
      cancelPendingLoad();
    }

    // No insistir continuamente ante un fallo.
    if (Date.now() < retryAfter) {
      return;
    }

    // Si todavía no hay obra visible,
    // utilizar la primera capa.
    const nextLayer =
      activeLayer === -1
        ? 0
        : 1 - activeLayer;

    const layer = layers[nextLayer];
    const frame = frames[nextLayer];

    const requestNumber = ++loadCounter;

    const artworkURL =
      ORDINALS_CONTENT +
      TXID +
      "i" +
      artworkIndex;

    pendingArtwork = artworkIndex;

    // La capa de destino debe permanecer oculta.
    layer.classList.remove("active");

    // ----------------------------------------------
    // CONTROL DE CARGA COMPLETADA
    // ----------------------------------------------

    frame.onload = function () {

      if (requestNumber !== loadCounter) {
        return;
      }

      // La navegación terminó.
      // Esperar antes de cambiar la visualización.
      if (loadWatchdog !== null) {
        clearTimeout(loadWatchdog);
        loadWatchdog = null;
      }

      stabilizationTimer = setTimeout(function () {

        commitArtwork(
          artworkIndex,
          nextLayer,
          requestNumber
        );

      }, STABILIZATION_TIME);
    };

    // ----------------------------------------------
    // CONTROL DE ERROR
    // ----------------------------------------------

    frame.onerror = function () {

      handleLoadFailure(
        artworkIndex,
        requestNumber,
        "Evento onerror"
      );
    };

    // ----------------------------------------------
    // VIGILANTE DE TIEMPO DE ESPERA
    // ----------------------------------------------

    loadWatchdog = setTimeout(function () {

      handleLoadFailure(
        artworkIndex,
        requestNumber,
        "Tiempo de carga agotado"
      );

    }, LOAD_TIMEOUT);

    // ----------------------------------------------
    // INICIAR NAVEGACIÓN
    // ----------------------------------------------

    console.log(
      "Ego: solicitando obra",
      artworkIndex,
      artworkURL
    );

    frame.src = artworkURL;
  }

  // --------------------------------------------------
  // RELOJ LOCAL
  // --------------------------------------------------

  function updateArtwork() {

    const now = new Date();

    const minutesOfDay =
      now.getHours() * 60 +
      now.getMinutes();

    const sequencePosition =
      Math.floor(
        minutesOfDay / INTERVAL_MINUTES
      ) % sequence.length;

    const artworkIndex =
      sequence[sequencePosition];

    showArtwork(artworkIndex);
  }

  // --------------------------------------------------
  // MODO DE PRUEBA
  // ?nft=1&art=0
  // --------------------------------------------------

  const testArtwork = params.get("art");

  if (testArtwork !== null) {

    const forcedPosition = Number(testArtwork);

    if (
      !Number.isInteger(forcedPosition) ||
      forcedPosition < 0 ||
      forcedPosition >= sequence.length
    ) {
      errorElement.textContent =
        "ERROR: art debe estar entre 0 y " +
        (sequence.length - 1) +
        " para este NFT.";

      errorElement.style.display = "flex";
      return;
    }

    const artworkIndex =
      sequence[forcedPosition];

    showArtwork(artworkIndex);

  } else {

    updateArtwork();

    // Revisar el reloj cada segundo.
    setInterval(updateArtwork, 1000);
  }

})();
</script>

</body>
</html>
